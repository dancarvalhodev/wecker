services:
    caddy:
        build:
            context: bin/caddy
        container_name: ${CONTAINER_NAME}caddy
        depends_on:
            - php
        ports:
            - ${PORT_HTTP}:80
        volumes:
            - ./www/public:/var/www/html/public:ro
            - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
        restart: always
    php:
        build:
            context: bin/php
        container_name: ${CONTAINER_NAME}php
        user: root
        volumes:
            - ./www:/var/www/html
            - ./config/php/php.ini:/etc/php/8.5/fpm/conf.d/99-wecker.ini:ro
            - ./config/php/php.ini:/etc/php/8.5/cli/conf.d/99-wecker.ini:ro
            - /var/run/docker.sock:/var/run/docker.sock
        restart: always
    redis:
        build:
            context: bin/redis
        container_name: ${CONTAINER_NAME}redis
        restart: always
        volumes:
            - ./data/redis:/data
        ports:
            - "6379:6379"
    postgres:
        build:
            context: bin/postgres
        container_name: ${CONTAINER_NAME}postgres
        depends_on:
          - php
        ports:
            - ${POSTGRES_PORT}:5432
        volumes:
          - ./data/postgres:/var/lib/postgresql
        environment:
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_DB: ${POSTGRES_DB}
        restart: always